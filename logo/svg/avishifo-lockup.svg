      <stop offset="0" stop-color="#14A5E4" />
      <stop offset="0.55" stop-color="#0B87C1" />
      <stop offset="1" stop-color="#0A5C8C" />
    </linearGradient>
  </defs>

  <g transform="translate(0 8)">
