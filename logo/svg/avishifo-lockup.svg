<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-label="AviShifo">
  <title>AviShifo</title>
  <desc>Horizontal lockup: brand mark + wordmark. The wordmark is live text in an
  Inter/system-UI stack, so it falls back to the local UI font where Inter is
  absent. For anything going outside the team — print, partners, app stores —
  use the PNG exports in ../png, which are rendered once and pixel-identical
  everywhere.</desc>
