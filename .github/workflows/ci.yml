name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: avishifo
          POSTGRES_PASSWORD: avishifo
          POSTGRES_DB: avishifo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avishifo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://avishifo:avishifo@localhost:5432/avishifo_test?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate JWT dev keys
        run: node scripts/generate-keys.mjs

      - name: Generate Prisma client
        run: pnpm --filter @avishifo/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations
        run: pnpm --filter @avishifo/api exec prisma migrate deploy

      - name: Unit tests
        run: pnpm test

      - name: API e2e tests
        run: pnpm --filter @avishifo/api test:e2e

      - name: Build
        run: pnpm build
